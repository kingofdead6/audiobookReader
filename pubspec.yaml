name: qari
description: "Qari (قارئ) - offline PDF audiobook reader for English and Arabic."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State management
  flutter_riverpod: ^3.4.3

  # Local storage
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1

  # PDF import, text extraction and cover rendering
  file_picker: ^13.1.0
  pdfrx: ^2.6.5
  image: ^4.8.0
  crypto: ^3.0.7

  # Speech and audio
  flutter_tts: ^4.2.5
  just_audio: ^0.10.6
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  # Only for tool/inspect_pdf.dart (desktop extraction check).
  pdfrx_engine: ^0.6.1
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  generate: true
